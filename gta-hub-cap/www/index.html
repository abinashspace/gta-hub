<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F0F23">
<title>GTA Hub</title>
<style>
  :root {
    --bg: #0F0F23;
    --surface: #1E1C35;
    --primary: #7C3AED;
    --accent: #F43F5E;
    --text: #EDEBFF;
    --muted: #9A96BD;
    --success: #22D3A5;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
  }
  .glow {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(60% 40% at 50% 0%, rgba(124, 58, 237, 0.35), transparent 70%),
      radial-gradient(50% 35% at 50% 100%, rgba(244, 63, 94, 0.18), transparent 70%);
    pointer-events: none;
  }
  main {
    position: relative;
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .badge {
    width: 84px;
    height: 84px;
    margin: 0 auto 22px;
    border-radius: 24px;
    background: linear-gradient(145deg, var(--primary), var(--accent));
    display: grid;
    place-items: center;
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 0.02em;
    color: #fff;
    box-shadow: 0 18px 44px rgba(124, 58, 237, 0.45);
  }
  h1 {
    margin: 0 0 6px;
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .sub {
    margin: 0 0 34px;
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--primary);
    font-weight: 700;
  }
  .status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 22px;
    font-size: 15px;
    color: var(--muted);
  }
  .spinner {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid rgba(124, 58, 237, 0.25);
    border-top-color: var(--primary);
    animation: spin 0.8s linear infinite;
    flex: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .bar {
    position: relative;
    height: 4px;
    margin-top: 26px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.07);
    overflow: hidden;
  }
  .bar span {
    position: absolute;
    inset: 0 auto 0 0;
    width: 40%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--primary), var(--accent));
    animation: slide 1.4s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { left: -40%; }
    100% { left: 100%; }
  }
  .panel { display: none; }
  .panel.show { display: block; }
  .card {
    margin-top: 26px;
    padding: 20px;
    border-radius: 20px;
    background: var(--surface);
    border: 1px solid rgba(124, 58, 237, 0.25);
    text-align: left;
  }
  .card h2 {
    margin: 0 0 8px;
    font-size: 16px;
    font-weight: 800;
  }
  .card p {
    margin: 0;
    font-size: 14px;
    line-height: 1.55;
    color: var(--muted);
  }
  button, .btn {
    display: block;
    width: 100%;
    margin-top: 18px;
    min-height: 52px;
    padding: 0 20px;
    border: 0;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: #fff;
    background: var(--primary);
    font-family: inherit;
    text-align: center;
    text-decoration: none;
    line-height: 52px;
    cursor: pointer;
  }
  button:active, .btn:active { transform: scale(0.98); opacity: 0.92; }
  .btn.secondary {
    background: transparent;
    border: 1px solid rgba(124, 58, 237, 0.45);
    color: var(--text);
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--success);
    flex: none;
    box-shadow: 0 0 12px var(--success);
  }
  .foot {
    margin-top: 30px;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(154, 150, 189, 0.55);
  }
</style>
</head>
<body>
<div class="glow"></div>
<main>
  <div class="badge">GTA</div>
  <h1>GTA Hub</h1>
  <p class="sub">Encyclopedia</p>

  <div class="panel show" id="loading">
    <div class="status"><span class="spinner"></span><span id="loadingText">Connecting&hellip;</span></div>
    <div class="bar"><span></span></div>
  </div>

  <div class="panel" id="offline">
    <div class="status"><span class="dot" style="background:#F43F5E;box-shadow:0 0 12px #F43F5E"></span>You appear to be offline</div>
    <div class="card">
      <h2>No connection</h2>
      <p>GTA Hub needs an internet connection the first time it loads each page. Turn on mobile data or Wi-Fi, then try again.</p>
    </div>
    <button id="retry">Try again</button>
    <a class="btn secondary" href="https://abinashspace.github.io/public-pages/gta-hub/" target="_blank" rel="noopener">Open in browser</a>
  </div>

  <p class="foot">abinashspace.github.io/public-pages/gta-hub</p>
</main>

<script>
  var TARGET = 'https://abinashspace.github.io/public-pages/gta-hub/';
  var loadedAt = Date.now();
  var attempts = 0;

  var loading = document.getElementById('loading');
  var offline = document.getElementById('offline');
  var loadingText = document.getElementById('loadingText');

  function showOffline() {
    loading.classList.remove('show');
    offline.classList.add('show');
  }

  function go() {
    if (navigator.onLine === false) {
      showOffline();
      return;
    }
    attempts++;
    if (attempts > 1) {
      loadingText.textContent = 'Reconnecting\u2026';
    }
    // Keep the splash up briefly so it reads as loading, not a flash.
    setTimeout(function () {
      window.location.replace(TARGET);
    }, 250);
  }

  // If we are still on this page well after attempting navigation,
  // the remote site did not load — offer the retry panel.
  setTimeout(function () {
    if (document.visibilityState === 'visible' && Date.now() - loadedAt > 3500) {
      showOffline();
    }
  }, 7000);

  document.getElementById('retry').addEventListener('click', function () {
    loadedAt = Date.now();
    offline.classList.remove('show');
    loading.classList.add('show');
    loadingText.textContent = 'Reconnecting\u2026';
    go();
  });

  window.addEventListener('online', function () { go(); });

  go();
</script>
</body>
</html>
